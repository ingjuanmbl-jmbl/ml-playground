[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-playground"
version = "0.1.0"
description = "Interactive laboratory for exploring machine learning models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.3",
    "pandas==2.3.3",
    "plotly==6.6.0",
    "scikit-learn==1.8.0",
    "streamlit==1.55.0",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
